name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Embed build identity and prepare release metadata
        env:
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, os, datetime
          root=Path('.')
          vals=[os.getenv('KEYSTORE_BASE64',''),os.getenv('KEYSTORE_PASSWORD',''),os.getenv('KEY_ALIAS',''),os.getenv('KEY_PASSWORD','')]
          if not all(vals):
              raise SystemExit('Release signing secrets are missing. In Settings > Secrets and variables > Actions add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Builds are never signed with a throw-away debug key because that breaks in-place updates.')
          mode='release'
          repo=os.environ['REPO_NAME']
          n=int(os.environ['BUILD_NUMBER'])
          config={
              'repository':repo,
              'tag':'latest-apk',
              'buildSha':os.environ['COMMIT_SHA'],
              'version':f'1.0.0+{n}',
              'buildNumber':n,
              'signingMode':mode,
              'releasePage':f'https://github.com/{repo}/releases/tag/latest-apk'
          }
          (root/'www/update-config.js').write_text('// Generated by GitHub Actions; do not edit in source commits.\nwindow.FL_UPDATE_CONFIG = '+json.dumps(config,separators=(',',':'))+';\n')
          # A unique cache version per APK ensures updated HTML, formulas, and build metadata are picked up after installation.
          sw=root/'www/sw.js'
          sw_text=sw.read_text()
          import re
          sw_text,count=re.subn(r"const V\s*=\s*'[^']+'",f"const V = 'formulater-v{n}'",sw_text,count=1)
          if count!=1: raise SystemExit('Could not update the service-worker cache version')
          sw.write_text(sw_text)
          release=dict(config)
          release['builtAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          (root/'FormuLater-version.json').write_text(json.dumps(release,indent=2)+'\n')
          print(f"Embedded update identity for {repo} at {config['buildSha']} ({config['version']}, signing={mode})")
          PYCODE
      - name: Add offline Greek OCR language model
        run: |
          mkdir -p www/lib/lang
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ell.traineddata \
            --output www/lib/lang/ell.traineddata
          test -s www/lib/lang/ell.traineddata
          size=$(wc -c < www/lib/lang/ell.traineddata | tr -d ' ')
          test "$size" -gt 1000000
          if [ "$(head -c 1 www/lib/lang/ell.traineddata)" = "<" ]; then
            echo "Greek OCR model download returned a web page, not traineddata"
            exit 1
          fi
      - run: npx cap add android
      - name: Allow rotation, tablets and resizable windows
        run: |
          set -eu
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          m = re.search(r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>', s, re.S)
          if not m:
              raise SystemExit('MainActivity <activity> tag not found in AndroidManifest.xml')
          tag = m.group(0)
          new = re.sub(r'\s+android:screenOrientation="[^"]*"', '', tag)  # never lock the orientation
          need = ['orientation', 'screenSize', 'smallestScreenSize', 'screenLayout', 'density', 'keyboard', 'keyboardHidden', 'uiMode']
          cc = re.search(r'android:configChanges="([^"]*)"', new)
          if cc:
              have = cc.group(1).split('|')
              merged = '|'.join(have + [x for x in need if x not in have])
              new = new.replace(cc.group(0), 'android:configChanges="%s"' % merged)
          else:
              new = new.replace('<activity', '<activity\n            android:configChanges="%s"' % '|'.join(need), 1)
          if 'android:resizeableActivity' not in new:
              new = new.replace('<activity', '<activity\n            android:resizeableActivity="true"', 1)
          s = s.replace(tag, new)
          p.write_text(s)
          print(new)
          PYCODE
          grep -q 'screenSize' android/app/src/main/AndroidManifest.xml
          ! grep -q 'screenOrientation' android/app/src/main/AndroidManifest.xml
      - name: Register local folder picker plugin
        run: |
          set -eu
          mkdir -p android/app/src/main/java/com/formulater/app
          cp native/android/FormulaFolderPlugin.java android/app/src/main/java/com/formulater/app/FormulaFolderPlugin.java
          cp native/android/SystemBarsPlugin.java android/app/src/main/java/com/formulater/app/SystemBarsPlugin.java
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/java/com/formulater/app/MainActivity.java')
          s = p.read_text()
          if 'import android.os.Bundle;' not in s:
              s = s.replace('package com.formulater.app;', 'package com.formulater.app;\n\nimport android.os.Bundle;')
          if 'import android.view.Window;' not in s:
              s = s.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport android.view.Window;')
          if 'import androidx.core.view.WindowCompat;' not in s:
              s = s.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport androidx.core.view.WindowCompat;')
          pattern = r'public class MainActivity extends BridgeActivity\s*\{\s*\}'
          replacement = ("public class MainActivity extends BridgeActivity {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        registerPlugin(FormulaFolderPlugin.class);\n"
              "        registerPlugin(SystemBarsPlugin.class);\n"
              "        super.onCreate(savedInstanceState);\n"
              "        configureEdgeToEdge();\n"
              "    }\n\n"
              "    private void configureEdgeToEdge() {\n"
              "        Window window = getWindow();\n"
              "        WindowCompat.setDecorFitsSystemWindows(window, false);\n"
              "    }\n"
              "}")
          if re.search(pattern, s):
              s = re.sub(pattern, lambda _m: replacement, s, count=1)
          elif 'registerPlugin(FormulaFolderPlugin.class)' not in s or 'registerPlugin(SystemBarsPlugin.class)' not in s:
              raise SystemExit('Could not safely register local plugins in MainActivity.java')
          p.write_text(s)
          # Give every CI APK an increasing versionCode so Android recognizes later versions as updates.
          gradle = Path('android/app/build.gradle')
          gs = gradle.read_text()
          build_number = int(__import__('os').environ.get('GITHUB_RUN_NUMBER', '1'))
          version_code = 100000 + build_number
          if re.search(r'versionCode\s+\d+', gs):
              gs = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', gs, count=1)
          else:
              raise SystemExit('Could not find Android versionCode in app/build.gradle')
          if re.search(r'versionName\s+"[^"]*"', gs):
              gs = re.sub(r'versionName\s+"[^"]*"', f'versionName "1.0.0+{build_number}"', gs, count=1)
          else:
              raise SystemExit('Could not find Android versionName in app/build.gradle')
          gradle.write_text(gs)
          PYCODE
      - name: Ensure share-sheet FileProvider is configured
        run: |
          set -eu
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
          </paths>
          XMLEOF
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'androidx.core.content.FileProvider' not in s:
              prov = ('<provider android:name="androidx.core.content.FileProvider" '
                      'android:authorities="${applicationId}.fileprovider" android:exported="false" '
                      'android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" '
                      'android:resource="@xml/file_paths" /></provider>')
              s = s.replace('</application>', prov + '</application>', 1)
              p.write_text(s)
          PYCODE
          grep -q 'fileprovider' android/app/src/main/AndroidManifest.xml
      - name: Configure persistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          # Strip any line breaks or spaces that were pasted along with the Base64 text.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/release.keystore
          test -s android/release.keystore
          # Fail early, with a clear message, if the alias or passwords do not match the keystore.
          keytool -list -keystore android/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null \
            || { echo "Keystore check failed: verify ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."; exit 1; }
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'signingConfigs {' not in s:
              signing = ('    signingConfigs {\n'
                         '        release {\n'
                         '            storeFile rootProject.file("release.keystore")\n'
                         '            storePassword System.getenv("KEYSTORE_PASSWORD")\n'
                         '            keyAlias System.getenv("KEY_ALIAS")\n'
                         '            keyPassword System.getenv("KEY_PASSWORD")\n'
                         '        }\n'
                         '    }\n\n'
                         '    buildTypes {')
              s=s.replace('    buildTypes {', signing, 1)
          build_types=s.find('buildTypes {')
          if build_types<0:
              raise SystemExit('Could not locate buildTypes in app/build.gradle')
          match=re.search(r'release\s*\{',s[build_types:])
          if not match:
              raise SystemExit('Could not locate release build type in app/build.gradle')
          after=build_types+match.end()
          if 'signingConfig signingConfigs.release' not in s[after:after+160]:
              s=s[:after]+'\n            signingConfig signingConfigs.release'+s[after:]
          p.write_text(s)
          PYCODE
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
      - name: Set app icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp www/icon-192.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
      - run: npx cap sync android
      - name: Explicitly stage OCR models in Android web assets
        run: |
          set -eu
          mkdir -p android/app/src/main/assets/public/lib/lang
          cp www/lib/lang/eng.traineddata android/app/src/main/assets/public/lib/lang/eng.traineddata
          cp www/lib/lang/ell.traineddata android/app/src/main/assets/public/lib/lang/ell.traineddata
      - name: Verify OCR models before APK build
        run: |
          set -eu
          f=android/app/src/main/assets/public/lib/lang/eng.traineddata
          test -f "$f"
          test "$(wc -c < "$f" | tr -d ' ')" = "5199098"
          if [ "$(od -An -tx1 -N2 "$f" | tr -d ' \n')" = "1f8b" ]; then
            echo "OCR language data is still gzip-compressed; expected eng.traineddata"
            exit 1
          fi
          g=android/app/src/main/assets/public/lib/lang/ell.traineddata
          test -s "$g"
          test "$(wc -c < "$g" | tr -d ' ')" -gt 1000000
          if [ "$(head -c 1 "$g")" = "<" ]; then
            echo "Greek OCR model was not packaged correctly"
            exit 1
          fi
      - name: Build installable APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify both OCR models are inside the built APK
        run: |
          set -eu
          apk=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -F 'assets/public/lib/lang/eng.traineddata'
          unzip -l "$apk" | grep -F 'assets/public/lib/lang/ell.traineddata'
          ell_size=$(unzip -p "$apk" assets/public/lib/lang/ell.traineddata | wc -c | tr -d ' ')
          test "$ell_size" -gt 1000000
          eng_size=$(unzip -p "$apk" assets/public/lib/lang/eng.traineddata | wc -c | tr -d ' ')
          test "$eng_size" = "5199098"
      - name: Stage APK for publication
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FormuLater.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FormuLater-apk
          path: FormuLater.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          files: |
            FormuLater.apk
            FormuLater-version.json
          fail_on_unmatched_files: true
