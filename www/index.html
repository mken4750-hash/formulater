<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FormuLater</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2e8d5">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ff:'Roboto','Arial',system-ui,sans-serif;--onacc:#4a3b2a;--tb:color-mix(in srgb,var(--ink) 16%,var(--card));--accd:color-mix(in srgb,var(--acc) 55%,var(--ink));--bg:#f2e8d5;--card:#fbf6ea;--ink:#4a3b2a;--mut:#8a7a62;--pill:#e4d5b7;--acc:#b08a52;--native-safe-top:0px;--native-safe-bottom:0px;box-sizing:border-box;padding-top:max(env(safe-area-inset-top,0px),var(--native-safe-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--native-safe-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b241b;--card:#3a3126;--ink:#f1e6d0;--mut:#b5a58a;--pill:#4a3f30;--acc:#d2a967}}
:root[data-theme="dark"]{--bg:#2b241b;--card:#3a3126;--ink:#f1e6d0;--mut:#b5a58a;--pill:#4a3f30;--acc:#d2a967}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;touch-action:pan-x pan-y;background:var(--bg);color:var(--ink)}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;min-height:56px;background:var(--bg);color:var(--ink)}
h1{font-size:20px;margin:0;font-weight:600}
.back{background:none;border:0;color:var(--ink);font-size:22px;padding:4px 8px}
main{flex:1;display:flex;flex-direction:column;padding:8px 20px 24px;gap:14px;overflow-y:auto;background:var(--bg);color:var(--ink)}
.pill{background:var(--pill);color:var(--ink);border:0;border-radius:999px;padding:16px 22px;font:600 17px var(--ff);text-align:left;display:flex;justify-content:space-between;align-items:center}
.pill small{font:12px var(--ff);color:var(--mut)}
.pill[disabled]{opacity:.5}
.lbl{color:var(--mut);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:6px 4px 0}
.scene{perspective:1000px;flex:1;min-height:320px;max-height:460px}
.card{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:24px;box-shadow:0 6px 20px rgba(74,59,42,.18);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.back-f{transform:rotateY(180deg);justify-content:space-between}
.name{font-size:26px;font-weight:600}
.hint{position:absolute;bottom:16px;font-size:12px;color:var(--mut);opacity:1;transition:opacity .4s ease}.hint.fade{opacity:0;pointer-events:none}
.formula{font-size:30px;flex:1;display:flex;align-items:center}
.where{align-self:flex-start;font-size:16px;line-height:1.7;color:var(--mut);border-top:1px solid var(--pill);padding-top:12px;width:100%;text-align:left}
.where b{color:var(--ink)}
.nav{display:flex;gap:12px;align-items:center}
.nav .pill{flex:1;justify-content:center}
.cnt{color:var(--mut);min-width:60px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.cnt-hint{font-size:11px;opacity:.72;transition:opacity .5s ease,transform .5s ease}.cnt-hint.fade{opacity:0;transform:translateY(4px)}

.q{font-size:24px;font-weight:600;text-align:center;margin-top:6px}
.ans{min-height:56px;font-size:30px;text-align:center;border-bottom:2px solid var(--ink);padding:8px 4px;letter-spacing:.04em;word-break:break-all}
.msg{min-height:18px;text-align:center;color:var(--accd);font-size:14px}.msg.success{color:#246b35;background:#e4f5e7;border:1px solid #a8d7b1;border-radius:10px;padding:8px 10px;font-weight:700}.category-delete-confirm{display:flex;flex-direction:column;gap:10px;border:1px solid #e4a0a0;background:color-mix(in srgb,#ffe7e7 72%,var(--card));border-radius:14px;padding:12px;color:#842525;font-size:14px;line-height:1.45}.pill.danger{background:#c93434!important;color:#fff!important;border-color:#a82020!important;box-shadow:0 3px 0 #951b1b}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.grp,.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill.g{padding:9px 14px;font-size:14px}
.pill.o{padding:10px 16px;font-size:20px;min-width:52px;justify-content:center}
.pill.on{background:var(--acc);color:var(--onacc)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:5}
#ov[hidden]{display:none}
#sb{position:fixed;top:0;right:0;bottom:0;width:82%;max-width:320px;background:var(--card);z-index:6;transform:translateX(100%);transition:transform .3s;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px;overflow-y:auto;box-shadow:-6px 0 20px rgba(0,0,0,.2)}
#sb.open{transform:none}
#sb h2{font-size:18px;margin:0 0 12px}
.si{padding:10px 0;border-bottom:1px solid var(--pill);color:var(--mut);font-size:15px}
.si.ok{color:var(--ink)}
.ans.ok{border-color:var(--accd)}

.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;height:calc(100dvh - 210px);min-height:320px;padding-bottom:6px}
.vc{flex:0 0 86%;scroll-snap-align:center;background:var(--card);border-radius:24px;box-shadow:0 6px 20px rgba(74,59,42,.18);padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.vc .name{text-align:center;font-size:22px}
.cn{color:var(--mut);font-size:12px;align-self:flex-end}
.formula2{font-size:28px;text-align:center;padding:8px 0}
.mn{background:var(--pill);border-radius:14px;padding:10px 14px;font-size:15px}
.vc .where{border-top:1px solid var(--pill)}
input,textarea,select{background:var(--card);color:var(--ink);border:0;border-radius:16px;padding:13px 14px;font:16px var(--ff);width:100%}
textarea{resize:none}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:18px;padding:12px 4px;border:3px solid transparent;font:13px var(--ff)}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;margin:0 2px;border:1px solid rgba(0,0,0,.08)}
.ac{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.sel,.ac.sel{border-color:var(--ink)}
.pill.sel{background:var(--acc);color:var(--onacc)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{touch-action:manipulation;transition:transform .12s ease,background-color .25s ease,color .25s ease}
button:active{transform:scale(.96)}
.card{will-change:transform;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.row{scroll-behavior:smooth;overscroll-behavior-x:contain}
#sb{will-change:transform}
main{overscroll-behavior:contain}
body{transition:background-color .35s ease,color .35s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
.tile{background:var(--card);color:var(--ink);border:2px solid var(--tb);border-bottom-width:4px;border-radius:14px;padding:9px 16px;font:500 20px var(--ff);min-width:46px;min-height:46px}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile.a{height:50px;padding:0 14px}
.pop{animation:pop .22s cubic-bezier(.3,1.6,.5,1)}
.ans{min-height:128px;display:flex;flex-wrap:wrap;gap:14px 8px;align-content:flex-start;padding:0;border:0;text-align:left;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 62px,var(--tb) 62px,var(--tb) 64px)}
.nav.b{margin-top:auto}
.pri{flex:2;background:var(--acc);color:var(--onacc);border:0;border-radius:16px;padding:15px;font:700 16px var(--ff);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 4px 0 var(--accd)}
.pri:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accd)}
.pri:disabled{background:var(--pill);color:var(--mut);box-shadow:0 4px 0 var(--tb)}
#fb{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:10px}
#fb.show{transform:none}
#fb.ok{background:#cdeec3;color:#4b8a2c}
#fb.bad{background:#f8d3d6;color:#b04d58}
.ft{font:700 22px var(--ff)}
.ff{font:17px var(--ff);opacity:.9}
.fbtn{border:0;border-radius:16px;padding:15px;font:700 16px var(--ff);letter-spacing:.08em;text-transform:uppercase;color:#fff}
#fb.ok .fbtn{background:#8fd15f;box-shadow:0 4px 0 #6fb143}
#fb.bad .fbtn{background:#ee8f98;box-shadow:0 4px 0 #cf6f79}
.fbtn:active{transform:translateY(3px);box-shadow:none}
/* tile look everywhere */
.pill{background:var(--card);border:2px solid var(--tb);border-bottom-width:4px;border-radius:16px;padding:14px 18px}
.pill:active{transform:translateY(2px);border-bottom-width:2px}
.pill.g{padding:8px 14px;border-radius:14px}
.pill.on,.pill.sel{background:var(--acc);color:var(--onacc);border-color:var(--accd)}
.pill[disabled]{opacity:.5}
.face,.vc{box-shadow:none;border:2px solid var(--tb);border-bottom-width:5px}
.sw{border-radius:16px}
input,textarea,select{border:2px solid var(--tb);border-bottom-width:4px;border-radius:14px}
.mn{border:2px solid var(--tb);background:var(--card)}
#sb{border-left:2px solid var(--tb)}

/* ===== MEMORIZATION: highlighted tiles, empty slots, flip & fall ===== */
:root{--hlbg:color-mix(in srgb,var(--acc) 26%,var(--card));--hlbd:var(--acc)}
.tile.a{position:relative}
.tile.a.hl{background:var(--card);border-color:var(--tb);box-shadow:none}
.tile.a.settle{animation:tileSettle .32s ease-out}
@keyframes tileSettle{0%{border-color:var(--accd);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 28%,transparent)}65%{border-color:var(--acc);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 14%,transparent)}100%{border-color:var(--tb);box-shadow:none}}
@keyframes slotp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 35%,transparent)}}
.gh{position:absolute;left:-2px;top:-2px;right:-2px;bottom:-2px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;
 background:var(--hlbg);border:2px solid var(--hlbd);border-bottom-width:4px;border-radius:14px;font:500 20px var(--ff);color:var(--ink);
 animation:fall .65s cubic-bezier(.5,0,.9,.55) forwards}
@keyframes fall{to{transform:translate(var(--dx,0px),300px) rotate(var(--r,20deg));opacity:0}}
.tile.a.fall{pointer-events:none;z-index:3;animation:fall .75s cubic-bezier(.5,0,.9,.55) both}
.tile.a.bad{background:#f8d3d6;border-color:#ee8f98;color:#b04d58;box-shadow:none}
.tile.a.ok{animation:flip .6s ease both}
@keyframes flip{
 0%{transform:rotateX(0);background:var(--card);border-color:var(--tb);color:var(--ink)}
 35%{background:var(--hlbg);border-color:var(--accd);color:var(--ink)}
 49%{background:var(--hlbg);border-color:var(--accd);color:var(--ink)}
 50%{transform:rotateX(90deg);background:#7bc65a;border-color:#5ea341;color:#fff}
 100%{transform:rotateX(0);background:transparent;border-color:var(--tb);color:var(--ink)}}
.ans{overflow:visible;flex-shrink:0}

/* ===== typeset formulas ===== */
.fxw{text-align:center;max-width:100%}
.formula.fxw,.formula2.fxw{display:flex;align-items:center;justify-content:center}
.fx{display:inline-flex;align-items:center;white-space:nowrap;line-height:1.15}
.fxw.wr .fx{flex-wrap:wrap;justify-content:center;row-gap:.35em;max-width:100%}
.fxw.wr .sq,.fxw.wr .fr{max-width:100%}
.fxw.wr .sqb{flex:1;min-width:0}
.fxw.wr .sqb,.fxw.wr .fr>.n,.fxw.wr .fr>.d{flex-wrap:wrap;row-gap:.3em;justify-content:center}
.fx .c{padding:0 .02em}.fx .c.o{margin:0 .28em}
.fx .sup,.fx .sub{display:inline-flex;align-items:center;font-size:.66em;position:relative}
.fx .sup{top:-.62em}.fx .sub{top:.42em}
.fx .fr{display:inline-flex;flex-direction:column;align-items:stretch;margin:0 .12em}
.fx .fr>.n,.fx .fr>.d{display:inline-flex;align-items:center;justify-content:center;padding:0 .18em}
.fx .fr>.n{padding-bottom:.1em;border-bottom:max(1.5px,.07em) solid currentColor}
.fx .fr>.d{padding-top:.1em}
.fx .sq{display:inline-flex;align-items:stretch;margin:0 .06em}
.fx .rd{width:.72em;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:max(1.5px,.07em);stroke-linejoin:miter}
.fx .rd path{vector-effect:non-scaling-stroke}
.fx .sqb{display:inline-flex;align-items:center;border-top:max(1.5px,.07em) solid currentColor;padding:.14em .1em 0 .06em}
.si .fxw{font-size:15px;text-align:left}
/* ===== missing-block answer ===== */
.gb{font-size:23px;min-height:120px;padding:18px 0 10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gb .fx{align-items:center}
.fx .tile.a,.fx .gap{font:500 1em var(--ff);min-width:1.55em;height:1.85em;padding:0 .3em;margin:0 .07em;border-radius:.42em;display:inline-flex;align-items:center;justify-content:center;border-width:2px;border-bottom-width:3px}
.gap{position:relative;background:color-mix(in srgb,var(--ink) 10%,var(--bg));border:2px solid color-mix(in srgb,var(--ink) 20%,var(--bg));box-shadow:inset 0 .16em .32em rgba(0,0,0,.3),inset 0 -.05em 0 rgba(255,255,255,.22)}
.gap:active{transform:none}
.gap.sel{background:color-mix(in srgb,var(--acc) 32%,var(--bg));border-color:var(--hlbd);animation:slotp 1.1s ease-in-out infinite}
.fx .gh{font:inherit;left:-2px;top:-2px;right:-2px;bottom:-2px}
.fx .tile.a:active{transform:none}
.seg{display:flex;justify-content:center;margin-top:-4px}
.seg button{background:var(--card);color:var(--mut);border:2px solid var(--tb);padding:6px 16px;font:600 13px var(--ff)}
.seg button:first-child{border-radius:999px 0 0 999px;border-right-width:1px}
.seg button:last-child{border-radius:0 999px 999px 0;border-left-width:1px}
.seg button.on{background:var(--acc);color:var(--onacc);border-color:var(--accd)}
.seg button:active{transform:none}
/* v3: menu, flashcard swipe, bottom sheet, night filter */
.ctr{justify-content:center}
.ctr .pill{padding:22px;font-size:19px;justify-content:center;text-align:center}
.scene{touch-action:pan-y}
.drg{perspective:1000px;height:100%;will-change:transform}
.stb{position:absolute;top:10px;left:12px;background:none;border:0;font-size:28px;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--accd);z-index:2}
.si2{display:block;width:1em;height:1em;flex:none;overflow:visible}
.fbar{display:flex;justify-content:center}
.fbar .tile{font-size:26px;min-width:90px}
#bo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
#bo.show{opacity:1;pointer-events:auto}
#bs{overflow-y:auto;position:fixed;left:0;right:0;bottom:0;z-index:1000;max-height:68dvh;background:var(--card);border:2px solid var(--tb);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px}
#bs.show{transform:none}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px}.bh> b{min-width:0}.quiz-controls{flex-wrap:wrap;justify-content:flex-end}
.formula-action-tools{display:flex;align-items:center;gap:6px;flex:none}
.formula-action-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none;padding:5px;background:transparent;color:var(--accd);border:2px solid var(--tb);border-radius:12px}
.formula-action-icon svg{display:block;width:23px;height:23px}
.formula-action-icon[aria-pressed="true"]{background:var(--pill)}
.bg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;overflow-y:auto;overscroll-behavior:contain;padding:4px 2px 8px}
.blk{position:relative;aspect-ratio:1;background:var(--card);color:var(--ink);border:2px solid var(--tb);border-bottom-width:4px;border-radius:14px;font:600 17px var(--ff);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.blk.cur{background:var(--acc);color:var(--onacc);border-color:var(--accd)}
.blk.selected{outline:3px solid var(--accd);outline-offset:2px;background:color-mix(in srgb,var(--acc) 28%,var(--card))}.blk.cur.selected{background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.blk.st::after{content:'★';position:absolute;top:1px;right:5px;font-size:11px;color:var(--accd)}
.blk.cur.st::after{color:var(--onacc)}
.blk.drag{z-index:3;box-shadow:0 8px 18px rgba(0,0,0,.28);transition:none}
.quiz-controls{display:flex;align-items:center;gap:8px;flex:none}.quiz-controls .back{font-size:24px;padding:4px 7px;display:flex;align-items:center;justify-content:center}.quiz-controls .pill{font-size:14px;padding:8px 12px;white-space:nowrap}.nav-star-inline{display:inline-flex;vertical-align:middle;font-size:20px;padding:0 2px;margin-left:3px;align-items:center;justify-content:center;color:var(--accd)}.nav-star-inline svg{width:20px;height:20px}
.quizprefs{border:1.5px solid var(--tb);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;background:color-mix(in srgb,var(--pill) 22%,var(--card))}
.quizprefs-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}.quizprefs-head strong{font-size:15px}
#quizBatchRange{width:100%;height:24px;padding:0;margin:0;background:transparent;border:0;accent-color:var(--accd)}
.quizrangeends{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}.quizhint{font-size:12px;line-height:1.35;color:var(--mut);margin:0}.tile:disabled{opacity:.58;cursor:not-allowed}
#pv{position:fixed;left:50%;top:20%;transform:translateX(-50%) scale(.92);width:min(88vw,380px);z-index:1005;background:var(--card);border:2px solid var(--tb);border-bottom-width:5px;border-radius:22px;padding:18px;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .2s}
#pv.show{opacity:1;transform:translateX(-50%)}
#nv{position:fixed;inset:0;z-index:99;pointer-events:none;background:#ff9a3c;mix-blend-mode:multiply;opacity:0;transition:opacity .3s}
input[type=range]{border:0;padding:0;background:none;accent-color:var(--acc);width:100%}
/* v4: view-all pager, search, builder, trash */
.bl{min-height:62px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 1px;padding:8px 2px;border-bottom:2px solid var(--tb);font-size:27px}
.tkn{display:inline-block;padding:0 3px;min-width:.55em;text-align:center;border-radius:6px;background:color-mix(in srgb,var(--acc) 26%,transparent)}
.tkn.sel{background:color-mix(in srgb,var(--acc) 60%,transparent);outline:2px solid var(--accd)}
.ph{color:var(--mut);font-size:16px}
.bp{text-align:center;font-size:22px;min-height:40px}
.srch{display:flex;flex-direction:column;gap:8px}
.srch[hidden]{display:none}
#res{display:flex;flex-direction:column;gap:8px;max-height:38dvh;overflow-y:auto}
.sens{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.pg{flex:1;min-height:300px;position:relative;overflow:hidden;touch-action:none}.swipe-guide{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);font:300 88px/1 system-ui,sans-serif;color:var(--accd);opacity:.24;pointer-events:none;user-select:none;animation:swipeGhost 1.8s ease-in-out infinite;text-shadow:0 2px 12px color-mix(in srgb,var(--acc) 20%,transparent)}.swipe-guide.fade{opacity:0;transition:opacity .45s ease;animation:none}@keyframes swipeGhost{0%,100%{opacity:.10;transform:translate(-50%,-50%) scale(.94)}50%{opacity:.22;transform:translate(-50%,-50%) scale(1.04)}}
.trk{position:absolute;inset:0;display:flex;gap:14px;will-change:transform}
.trk.v{flex-direction:column}
.pg .vc{flex:0 0 100%;min-width:0;min-height:0;overflow:hidden;content-visibility:visible}
/* v5 */
.sh{flex:0 0 100%;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:6px 4px 0;text-align:left}
.opts>.opts{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.pl{display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 8px}
.pk{justify-content:space-between}
.erow{display:flex;gap:10px;align-items:stretch}

/* Formula variants in Build & Edit */
.variant-editbar{display:flex;flex-direction:column;align-items:stretch;gap:7px;margin:2px 0 5px}
.variant-block>.variant-label{text-transform:none;letter-spacing:.04em;font-size:11px}
.variant-edit-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));justify-content:start;align-items:stretch;gap:7px;max-width:520px}

/* Icon-only native keyboard toggle and accent-highlighted syntax guide. */
.builder-beam-row{display:flex;align-items:center;justify-content:flex-end;margin:-2px 0 -3px}.builder-add-beam{min-height:34px;padding:6px 12px;font-size:13px;text-transform:none;letter-spacing:0;justify-content:center;line-height:1}.builder-keyboard-row{display:flex;align-items:center;justify-content:flex-end;min-height:40px;margin:-2px 0 0}

/* v7: flashcards centred, chevron at the bottom (no box) */
.fmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0}

/* nth roots + integrals */
.fx .ri{display:inline-flex;align-items:center;align-self:flex-start;font-size:.55em;margin:0 -.3em 0 .1em;position:relative;top:.12em;z-index:1}

/* typing guide */
details.guide{background:var(--card);border:2px solid var(--tb);border-bottom-width:4px;border-radius:14px;padding:10px 14px;font-size:14px}
details.guide summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}

details.guide[open] summary{margin-bottom:8px}
.gr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--pill)}
.gr code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--pill);border-radius:8px;padding:3px 7px;word-break:break-all}
.gr .fxw{font-size:20px;text-align:left}.gr .fxw .fx{max-width:100%}
.gr i{font-style:normal;color:var(--mut)}
.gnote{color:var(--mut);font-size:12px;padding:2px 0 6px}
.left-side-help{display:flex;flex-direction:column;align-items:stretch;gap:4px;line-height:1.4}
.left-side-help>div{display:block;width:100%;text-align:left}
/* v6 */
.ctr .pill{flex-direction:column;gap:3px}
.nav.b .tile{flex:1}
#fb{max-height:72dvh;overflow-y:auto}
.fx .fr.h>.n{border-bottom:0}
.fx .fr.h>.bh{display:flex;justify-content:center;align-items:center}
.fx .tile.a.bw,.fx .gap.bw{display:flex;width:100%;min-width:1.4em;height:.95em;padding:0;margin:.05em 0}
.fx .tile.a.bw::before{content:'';position:absolute;left:.2em;right:.2em;top:50%;border-top:max(2px,.08em) solid currentColor}
.fx .tile.a.bw .fx,.fx .tile.a.bw .sq{font-size:.5em}
.fx .sq.h .rd{display:none}
.fx .sq.h .sqb{border-top-color:transparent}
.fx .sq.h:has(>.tile.a) .sqb{border-top-color:currentColor}
.fx .tile.a.rg,.fx .gap.rg{min-width:.8em;width:.8em;padding:0;height:auto;align-self:stretch;margin:0 .05em}
.fx .tile.a.rg .rd{display:block;width:.55em;height:1.2em;stroke:currentColor;fill:none}
.sp{margin-bottom:12px;font-size:13px;color:var(--mut)}
.spb{height:6px;border-radius:6px;background:var(--pill);overflow:hidden;margin:6px 0}
.spb i{display:block;height:100%;background:var(--acc);border-radius:6px}
.sl{display:flex;flex-direction:column;gap:6px}
.sr{border:2px solid transparent;border-radius:12px;padding:9px 12px;color:var(--mut);font-size:15px}
.sr.ok{background:color-mix(in srgb,var(--acc) 30%,var(--card));border-color:var(--accd);color:var(--ink);cursor:pointer}
.srh{display:flex;gap:10px;align-items:center}
.sn{font-size:12px;opacity:.6;min-width:1.6em}.st{flex:1}.ss{color:var(--accd)}
.sf{padding:8px 0 2px;text-align:left}
#gb{position:fixed;right:18px;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5;padding:6px;color:var(--accd)}
#gb[hidden]{display:none}
.pg .vc{position:relative;padding-top:48px}
.stb:active{transform:none}
.stb.pp .si2{animation:spop .55s cubic-bezier(.2,1.4,.4,1)}
.stb.pp::after{content:'';position:absolute;left:50%;top:50%;width:1em;height:1em;margin:-.5em 0 0 -.5em;border-radius:50%;border:2px solid var(--accd);animation:ring .55s ease-out forwards;pointer-events:none}
.stb.px .si2{animation:sxo .3s ease}
@keyframes spop{0%{transform:scale(.3) rotate(-60deg);opacity:.3}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:none}}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes sxo{50%{transform:scale(.55);opacity:.4}100%{transform:none}}
/* v7 */
.nav .tile{flex:1}
.eg{display:flex;flex-direction:column;gap:10px}
.eit{position:relative;will-change:transform;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.eit.chk::after{content:'✓';position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--onacc);border:2px solid var(--accd);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.eit.drag{z-index:3;box-shadow:0 8px 18px rgba(0,0,0,.28);transition:none}
#ab{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;background:var(--card);border:2px solid var(--tb);border-bottom-width:5px;border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:8px;transform:translateY(160%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#ab.show{transform:none}

.mnh{margin-top:10px;text-align:left}
.mh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mt{margin:3px 0 0 16px;font-style:italic;font-size:16px;line-height:1.35}
.mt b{font-weight:800}
/* elastic text boxes + live-bold mnemonic box */
textarea.el{flex-shrink:0;overflow:hidden;resize:none;display:block;min-height:50px;line-height:1.35}
.mw{position:relative;border-radius:14px;flex-shrink:0}

.mw textarea::selection{background:color-mix(in srgb,var(--acc) 45%,transparent)}
.mw:before{content:'';position:absolute;inset:0;border-radius:14px;background:var(--card)}
#fb .mh{color:inherit;opacity:.7}
.etb{display:flex;align-items:center;justify-content:space-between;gap:10px}
#tr{color:#b04d58;padding:6px}
#tr[hidden]{display:none}
/* Filled memorization holes render as text, not white tiles; keep the gap's falling animation. */
.fx .tile.a{background:transparent;color:inherit;border:0!important;border-radius:0!important;box-shadow:none!important}
.fx .tile.a:not(.bw):not(.rg){min-width:0!important;min-height:0!important;width:auto!important;height:auto!important;padding:0!important;margin:0 .03em!important;font:inherit!important;display:inline!important}
.fx .tile.a.bw{background:transparent;border:0!important;box-shadow:none!important}
.fx .tile.a.rg{background:transparent;border:0!important;box-shadow:none!important}
.fx .gh{background:transparent!important;color:inherit!important;border:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important}
.fx .tile.a.ok{animation:flip .6s ease both;border:2px solid #5ea341!important;border-radius:8px!important;box-shadow:0 2px 0 #5ea341!important}
.fx .tile.a.bad{animation:wordleWrong .45s ease}
.fx .tile.a.fall{animation:fall .75s cubic-bezier(.5,0,.9,.55) both}
@keyframes wordleWrong{0%,100%{transform:translateX(0);background:transparent;color:var(--ink)}15%{transform:translateX(-2px);background:#f8d3d6;color:#b04d58}45%{transform:translateX(2px);background:#f8d3d6;color:#b04d58}75%{transform:translateX(-1px);background:#f8d3d6;color:#b04d58}}
@keyframes flip{0%{transform:rotateX(0);background:transparent;color:var(--ink);filter:none}35%,49%{background:#cdeec3;color:#276b36;filter:brightness(1.25)}50%{transform:rotateX(90deg);background:#7bc65a;color:#fff;filter:brightness(1.3)}100%{transform:rotateX(0);background:#cdeec3;color:#276b36;filter:none}}

.etools{flex-wrap:wrap}

/* ===== RESPONSIVE LAYER: phones + tablets, portrait + landscape ===== */
/* Safe-area insets (cutout, status bar, nav bar - on any side) come from CSS env() or the native plugin, whichever is larger. */
:root{--sat:max(env(safe-area-inset-top,0px),var(--native-safe-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--native-safe-bottom,0px));--sal:max(env(safe-area-inset-left,0px),var(--native-safe-left,0px));--sar:max(env(safe-area-inset-right,0px),var(--native-safe-right,0px));--native-safe-left:0px;--native-safe-right:0px;--pad-x:20px;--hdr:56px;--colw:9999px;--cardh:clamp(320px,58dvh,470px);padding-left:var(--sal);padding-right:var(--sar)}
header{min-height:var(--hdr)}
main{overflow-x:hidden}
/* the content column is centred automatically: wide screens get side gutters instead of stretched controls */
main{padding-left:max(var(--pad-x),calc((100% - var(--colw))/2));padding-right:max(var(--pad-x),calc((100% - var(--colw))/2))}
.fmid .scene{height:var(--cardh)}
#sb{padding-top:calc(var(--sat) + 16px);padding-right:calc(18px + var(--sar))}
#fb{padding-bottom:calc(var(--sab) + 20px)}
#bs{padding-bottom:calc(var(--sab) + 18px)}
#ab{left:var(--sal);right:var(--sar);width:min(calc(100% - 24px - var(--sal) - var(--sar)),680px);margin-inline:auto;bottom:calc(var(--sab) + 14px)}
#gb{top:calc(var(--sat) + var(--hdr) - 4px);right:calc(var(--sar) + 18px)}#shb{top:calc(var(--sat) + var(--hdr) - 4px);right:calc(var(--sar) + 18px)}#shb.two{right:calc(var(--sar) + 62px)}
#up .udoc,#up .utb{display:contents}
.bg{grid-template-columns:repeat(5,1fr)}
.ctr .pill{width:100%}

/* medium + large widths (small tablets, big phones in landscape, split-screen) */
@media (min-width:600px){
 :root{--pad-x:32px;--colw:640px}
 #fb{left:0;right:0;width:min(100%,760px);margin:0 auto;border-radius:26px 26px 0 0;padding-left:28px;padding-right:28px}
 #bs{left:0;right:0;width:min(100%,640px);margin:0 auto}
 .bg{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
 #sb{max-width:380px}
 main.ctr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:center}
 main.ctr>:last-child:nth-child(odd){grid-column:1/-1}
 main.ctr>.pill{height:100%}
}
@media (min-width:900px) and (orientation:portrait){:root{--colw:720px}}
@media (min-width:900px){main.ctr{--colw:780px}}

/* real tablets (both sides >= 600dp): roomier type */
@media (min-width:600px) and (min-height:600px){
 :root{--cardh:clamp(360px,62dvh,760px)}

 .lbl{font-size:14px}
 .name{font-size:34px}.formula{font-size:42px}.where{font-size:19px}
 .vc .name{font-size:30px}.formula2{font-size:38px}.mn{font-size:18px}

}

/* ---- landscape (phone or tablet): two-pane layouts ---- */
@media (orientation:landscape) and (min-width:560px){
 main.fl,main.memv,main.va{--colw:1140px;overflow:hidden}
 /* flashcards: card fills the height, chevron moves to the side */

 main.fl .fmid{flex:1;min-width:0;min-height:0;gap:8px}
 main.fl .fmid .scene{flex:1;height:auto;min-height:0}

 main.fl .back-f .where{align-self:center;border-top:0;border-left:1px solid var(--pill);padding:0 0 0 22px;font-size:15px;line-height:1.5;max-height:100%;overflow-y:auto}
 /* view all: the card is two columns - formula on the left, notes on the right */
 main.va .pg{min-height:0}
 main.va .vc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-auto-rows:min-content;align-content:center;column-gap:26px;row-gap:10px;padding:46px 26px 16px}

 /* memorization: question + answer on the left, picker on the right */

 /* "correct" panel: answer on the left, notes + button on the right */
 #fb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;row-gap:8px;align-content:start;width:min(100%,980px)}

 /* bottom sheets dock to the right edge so the screen is not covered edge to edge */

 #pv.show{transform:translate(-50%,-50%)}
 /* upload: tool panel on the left, document on the right */
 #up .udoc{display:flex;flex:1;min-height:0}
 #up .utb{display:flex;flex-direction:column;flex:none;width:clamp(250px,36%,380px);overflow-y:auto;overscroll-behavior:contain;border-right:2px solid var(--tb);padding-bottom:8px}

@media (orientation:landscape) and (max-height:520px){

/* smooth reflow: only transforms/opacity are animated, nothing re-lays-out per frame */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* where: subscript / superscript / fractions */
.wo{margin:0 .24em}

const CATS={};for(const [k,entries] of Object.entries(RAW))CATS[k]=entries.map(d=>{const n=String(d.name||'').trim();const item={n,f:String(d.formula||''),w:Array.isArray(d.where)?d.where:[],m:typeof d.mnemonics==='string'?d.mnemonics:'',b:1,k0:k+':'+n};if(Array.isArray(d.acceptedAnswers)&&d.acceptedAnswers.length)item.a=d.acceptedAnswers;return item});

const safeCategoryLabel=(v)=>typeof v==='string'&&v.trim().length>0&&v.trim().length<=80&&!/[\u0000-\u001f\u007f]/u.test(v);

 CAT_META.names=raw.names&&typeof raw.names==='object'&&!Array.isArray(raw.names)?raw.names:{};

}}catch(_){}

CAT_META.deleted=[...new Set(CAT_META.deleted.filter(id=>typeof id==='string'&&/^[A-Z][A-Z0-9_]{0,63}$/.test(id)&&(BASE_CAT_IDS.includes(id)||CAT_META.custom.some(x=>x.id===id))))];
for(const x of CAT_META.custom)if(!CATS[x.id])CATS[x.id]=[];
for(const c of CAT_META.deleted)delete CATS[c];
for(const c of Object.keys(CATS))CAT_META.names[c]=safeCategoryLabel(CAT_META.names[c])?CAT_META.names[c].trim():(CAT_META.custom.find(x=>x.id===c)?.name||c);
const _subs={};for(const c of new Set([...Object.keys(CATS),...CAT_META.deleted])){const xs=Array.isArray(CAT_META.subcategories[c])?CAT_META.subcategories[c]:[],seen=new Set();_subs[c]=xs.filter(safeCategoryLabel).map(x=>x.trim()).filter(x=>{const k=categoryNorm(x);if(!k||seen.has(k))return false;seen.add(k);return true}).slice(0,200)}CAT_META.subcategories=_subs;
function categoryName(c){return CAT_META.names[c]||c}
function categoryKeys(){return Object.keys(CATS)}
function subcategoriesFor(c){return CAT_META.subcategories[c]||[]}
function persistCategoryMeta(){try{localStorage.setItem(CAT_META_KEY,JSON.stringify(CAT_META))}catch(_){};if(typeof scheduleFormulaSave==='function')scheduleFormulaSave()}
function categoryNameAvailable(name,except){const n=categoryNorm(name);return !!n&&!Object.keys(CATS).some(c=>c!==except&&categoryNorm(categoryName(c))===n)}

function validateImportCategoryMeta(raw){
 if(raw===undefined)return {};
 if(!Array.isArray(raw)||raw.length>100)throw new Error('Backup categories must be an array of no more than 100 items.');

 for(const x of raw){requireKnownKeys(x,['id','name','subcategories'],'Backup category');
  if(typeof x.id!=='string'||!/^[A-Z][A-Z0-9_]{0,63}$/.test(x.id)||!safeCategoryLabel(x.name)||!Array.isArray(x.subcategories)||x.subcategories.length>200||x.subcategories.some(v=>!safeCategoryLabel(v)))throw new Error('A backup category or subcategory name is invalid.');

}
function ensureImportedCategory(id,importMeta={},useImportedName=false,includeSubcategories=true){
 if(typeof id!=='string'||!/^[A-Z][A-Z0-9_]{0,63}$/.test(id))return false;

   if(!info||!safeCategoryLabel(info.name)||BASE_CAT_IDS.includes(id))return false;
   let importedName=info.name.trim();if(!categoryNameAvailable(importedName,id)){const root=importedName;let n=2;importedName=root+' (imported)';while(!categoryNameAvailable(importedName,id)){importedName=root+' (imported '+n+')';n++}}

  }

  const name=info.name.trim(),norm=categoryNorm(name);if(!norm||targetCounts.get(norm)!==1||occupied.has(norm))continue;
  if(categoryName(id)===name)continue;
  CAT_META.names[id]=name;const custom=CAT_META.custom.find(x=>x.id===id);if(custom)custom.name=name;changed=true;
